name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; leave blank to bump the minor version
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Bump version, build, and tag
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.release-version }}
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Bump version
        id: version
        run: |
          if test -n "$RELEASE_VERSION"; then
            uv version "$RELEASE_VERSION" --no-sync
          else
            uv version --bump minor --no-sync
          fi
          echo "RELEASE_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
          echo "release-version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Prepare release commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

      - name: Push release commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"

  generate-provenance:
    name: Generate build provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Attest distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - generate-provenance
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
        run: gh release create "v$RELEASE_VERSION" dist/* --generate-notes --verify-tag

  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
      - generate-provenance
      - release
    environment:
      name: pypi
      url: https://pypi.org/p/binaryninja-finder
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: true
